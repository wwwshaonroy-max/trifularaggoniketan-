name: Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

      - name: Run TypeScript Validation
        run: npx tsc --noEmit

      - name: Validate Firebase Security Rules
        run: |
          npx firebase-tools firestore:rules:stage --project tanhomeo || echo "Skipping rules validation as project tanhomeo may not be configured in CI environment"

      - name: Test Build
        run: npm run build
